spring.application.name=orders-api
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Dynamic overrides with local Docker defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
#postgres/pwd - root :- is the DB username of the postgresql containerized
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect